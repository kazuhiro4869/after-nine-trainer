function bestPriorResult(machine,g,bb,rb,priorKey='equal'){
  const s=SPECS[machine];const prior=PRIOR[priorKey]||PRIOR.equal;
  if(!s || g<bb+rb || g<=0) return null;
  const logs=s.bb.map((x,i)=>{
    const pb=1/x,pr=1/s.rb[i];
    return Math.log(prior[i])+bb*Math.log(pb)+rb*Math.log(pr)+(g-bb-rb)*Math.log(1-pb-pr);
  });
  const maximum=Math.max(...logs);const weights=logs.map(v=>Math.exp(v-maximum));const sum=weights.reduce((a,b)=>a+b,0);
  const prob=weights.map(v=>v/sum);
  const p456=prob.slice(3).reduce((a,b)=>a+b,0);
  const output=prob.reduce((a,p,i)=>a+p*s.payout[i],0);
  return {prob,p456,output};

 if(!getCase())return renderFinish();
 const mode=state.mode,c=getCase(),point=getSnapshot();
 const total=CASES[mode].length,progress=(state.index+(mode==='progress'?(state.stage/3):0))/total*100;
 const title = mode==='progress' ? `経過判断シミュレーション ${String(state.index+1).padStart(2,'0')}` : `着席判断トレーニング ${String(state.index+1).padStart(2,'0')}`;
 const question = mode==='progress'&&state.stage>0?'現在の履歴で、続行する？':'この台が空いていたら、座る？';
 return `<div class="shell page"><div class="quiz-shell"><div class="quiz-top"><button class="back" type="button" data-action="home">← トップへ戻る</button><span class="step-count">${CASE_MODES[mode].label} &nbsp; <strong>${String(state.index+1).padStart(2,'0')}</strong> / ${String(total).padStart(2,'0')}</span></div>
 <div class="quiz-progress"><span style="width:${progress.toFixed(2)}%"></span></div>
 ${mode==='compare'?renderCompare(c):`<div class="stage-strip"><span class="stage-pill">${mode==='progress'?`STAGE ${state.stage+1} / ${c.stages.length}`:'着席判断'}</span><span>${mode==='progress'?'各時点で推測を更新。途中結果で過去の判断は採点しません。':'20:55ごろ・46枚等価・ブドウ/設定示唆なし'}</span></div>
 <h1 class="quiz-title">${title}</h1>
 <div class="quiz-two-col"><div>${renderBoard(c.machine,point,mode==='progress'&&state.stage>0?c.stages[state.stage-1]:null)}</div>
 <section class="answer-panel"><span class="question-eyebrow">YOUR DECISION / ${point.at}</span><h2>${question}</h2><p class="question-description">設定期待度と、22:45までの残り時間を考慮して選んでください。</p>
 ${answerChoices(mode==='progress'&&state.stage>0)}
 <div class="answer-label">最も重視した判断材料は？</div>${reasonChoices()}${submitButton()}
 <p class="quick-hint">回答後に参考スタンスと統計モデルを比較できます。</p></section></div>`}
 </div></div>`;
}
function renderCompare(c){return `<div class="compare-wrapper"><div class="compare-head"><span class="question-eyebrow">PICK THE BEST / ${c.at}</span><h2>3台から選ぶ</h2><p>空き台が3台。今この時間から、どれを優先する？ すべて見送ってもOK。</p></div>
 <div class="compare-grid" role="group" aria-label="候補台の選択">
 ${c.candidates.map((item,i)=>{
 const letter='ABC'[i];return `<button class="compare-card ${state.choice===letter?'selected':''}" type="button" data-action="choose" data-choice="${letter}" aria-pressed="${state.choice===letter}"><div class="compare-card-head"><span class="candidate-letter">${letter}</span></div><div class="candidate-machine">${SPECS[item.machine].name}</div><div class="candidate-g">${fmt(item.g)}<span>G</span></div><div class="candidate-nums"><span>BB ${item.bb}</span><span>RB ${item.rb}</span></div><div class="candidate-rates">BB ${odds(item.g,item.bb)} ・ REG ${odds(item.g,item.rb)}<br>合算 ${odds(item.g,item.bb+item.rb)}</div></button>`;
 }).join('')}</div><div class="compare-controls"><div><div class="answer-label">選ばない、という判断もあり。</div><button type="button" data-action="choose" data-choice="skip" aria-pressed="${state.choice==='skip'}" class="skip-button ${state.choice==='skip'?'selected':''}">×　3台とも見送る</button><div class="answer-label">最も重視した判断材料は？</div>${reasonChoices()}</div><div class="compare-actions"><div class="answer-label">選択中：${state.choice ? state.choice==='skip'?'全台見送り':`候補 ${state.choice}`:'まだ選択していません'}</div>${submitButton()}<p class="quick-hint">モデル推定値は参考。機種別の設定配分で順位は変わります。</p></div></div></div>`;}
function getJudgement(){const c=getCase(),point=getSnapshot();const ref=state.mode==='compare'?c.preferred:point.stance;
 const acceptable=state.mode==='compare'?(c.alternates||[]):ref==='maybe'?['yes','no']:['maybe'];
 const exact=state.choice===ref,close=acceptable.includes(state.choice);
 return {ref,exact,close,goodReason:c.reasons.includes(state.reason),resultLabel:exact?'参考判断と一致':close?'別の見方も成立':'参考判断と異なる',chosenLabel:state.mode==='compare'?(state.choice==='skip'?'全台見送り':`候補 ${state.choice}`):(STANCE[state.choice]+' '+STANCE_SHORT[state.choice]),refLabel:state.mode==='compare'?(ref==='skip'?'全台見送り':`候補 ${ref}`):(STANCE[ref]+' '+STANCE_SHORT[ref])};
}
function submit(){if(!state.choice||!state.reason||state.submitted)return;
 const j=getJudgement();store.answers[responseKey()]={choice:state.choice,reason:state.reason,aligned:j.exact,close:j.close,goodReason:j.goodReason,at:new Date().toISOString()};persist();
 if(state.mode!=='progress'||state.choice==='no'||state.stage===getCase().stages.length-1)markDone();
 state.submitted=true;render();focusScroll();}
function markDone(){const c=getCase();if(!store.done.includes(c.id))store.done.push(c.id);persist();}
function next(){const c=getCase();
 if(state.mode==='progress'&&state.choice!=='no'&&state.stage<c.stages.length-1){state.stage++;state.choice=null;state.reason=null;state.submitted=false;render();focusScroll();return;}
 markDone();state.index++;state.stage=0;state.choice=null;state.reason=null;state.submitted=false;
 state.route=state.index>=CASES[state.mode].length?'finish':'quiz';render();focusScroll();}
function modelHtml(machine,point){const model=bestPriorResult(machine,point.g,point.bb,point.rb,state.prior);if(!model)return '';
 return `<div class="card-kicker">PROBABILITY MODEL / REFERENCE</div><h3>設定分布の参考計算</h3>
 <div class="prior-toggle" role="group" aria-label="設定配分の仮定"><button type="button" class="${state.prior==='equal'?'active':''}" data-action="prior" data-prior="equal" aria-pressed="${state.prior==='equal'}">全設定を均等と仮定</button><button type="button" class="${state.prior==='low'?'active':''}" data-action="prior" data-prior="low" aria-pressed="${state.prior==='low'}">低設定多めと仮定</button></div>
 <div class="model-overview"><div class="model-big"><small>設定4・5・6の合計</small><strong>${pct(model.p456)}</strong><span class="hint">指定した配分の仮定のもとで計算</span></div><div class="model-big"><small>出玉率の加重平均（参考）</small><strong>${model.output.toFixed(2)}<span>%</span></strong><span class="hint">実際の期待機械割を保証しない</span></div></div>
 ${model.prob.map((n,i)=>`<div class="posterior-row ${i>=3?'high':''}"><span class="posterior-label">設定${i+1}</span><div class="posterior-track"><span style="width:${(n*100).toFixed(2)}%"></span></div><span class="posterior-pct">${pct(n)}</span></div>`).join('')}
 <div class="model-box">${state.prior==='equal'?'全設定が同じ割合で投入されるという、比較用の仮定です。':'設定1〜6の事前配分を45 / 25 / 15 / 9 / 5 / 1%と置く仮定です。実店舗の配分ではありません。'}<br>BB・RBと総Gから算出した理論上の比較で、ブドウ確率・店の投入傾向・空き台になる事情などは含みません。</div>`;
}
function compareModelHtml(c){let rows=c.candidates.map((p,i)=>({letter:'ABC'[i],name:SPECS[p.machine].name,model:bestPriorResult(p.machine,p.g,p.bb,p.rb,state.prior)}));return `<div class="card-kicker">PROBABILITY MODEL / REFERENCE</div><h3>3台の統計モデル比較</h3>
 <div class="prior-toggle" role="group" aria-label="設定配分の仮定"><button type="button" data-action="prior" data-prior="equal" class="${state.prior==='equal'?'active':''}">全設定を均等と仮定</button><button type="button" data-action="prior" data-prior="low" class="${state.prior==='low'?'active':''}">低設定多めと仮定</button></div>
 <div style="overflow-x:auto"><table class="model-table"><thead><tr><th>台</th><th>4以上（モデル）</th><th>加重出玉率</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.letter===c.preferred?'highlight':''}"><td>${r.letter} · ${r.name}</td><td>${pct(r.model.p456)}</td><td>${r.model.output.toFixed(2)}%</td></tr>`).join('')}</tbody></table></div>
 <div class="model-box">${state.prior==='equal'?'全設定均等（各1/6）という仮定です。':'低設定多め（45 / 25 / 15 / 9 / 5 / 1%）という仮定です。'}<br>機種ごとのホール配分は同一とは限りません。加重出玉率は仮定による比較値で、実収益の推定精度を保証しません。</div>`;}
function renderFeedback(){const c=getCase(),point=getSnapshot(),j=getJudgement(),isComp=state.mode==='compare';
 const help=isComp?c.lesson:point.lesson;
 const reasonText=REASONS.find(r=>r.id===state.reason)?.label||'';
 const headline=j.exact?'判断の軸が揃っています':j.close?'判断が割れる、学びどころ':'判断の理由を比べてみよう';
 const referenceNote = isComp?'候補選択は教材用の参考順位。ほかの候補にも合理性が残る場合があります。':'参考スタンスは教材用の目安。○×の正解や実際の設定を意味しません。';
 return `<div class="shell page"><div class="feedback-shell"><div class="quiz-top"><button class="back" type="button" data-action="home">← トップへ戻る</button><span class="step-count">${CASE_MODES[state.mode].label} &nbsp; ${String(state.index+1).padStart(2,'0')} / ${String(CASES[state.mode].length).padStart(2,'0')}</span></div>
 <div class="feedback-banner"><span class="feedback-symbol" aria-hidden="true">${j.exact?'✓':j.close?'≋':'↗'}</span><div><span class="eyebrow">DECISION REVIEW</span><h2>${headline}</h2><p>${referenceNote}</p></div></div>
 <div class="feedback-layout"><div class="paper-card"><div class="card-kicker">WHY / 判断の根拠</div><h3>${isComp?c.title:state.mode==='progress'?c.title:c.title}</h3>
 <div class="feedback-choices"><div class="choice-summary"><small>あなたの判断</small><strong>${j.chosenLabel}</strong></div><div class="choice-summary"><small>教材の参考判断</small><strong>${j.refLabel}</strong></div></div>
 <div class="insight"><span class="insight-mark">01</span><span>${help}</span></div>
 <div class="insight"><span class="insight-mark">02</span><span><strong>選んだ理由：</strong>${reasonText}。${j.goodReason?'今回の主要な着眼点の一つです。':'今回も参考にはなりますが、まずは'+REASONS.filter(r=>c.reasons.includes(r.id)).map(r=>r.label).slice(0,2).join('・')+'を確認したい場面です。'}</span></div>
 <div class="insight"><span class="insight-mark">03</span><span>途中の勝ち負けは設定そのものを変えません。収支はリスク管理の材料、ボーナス履歴は設定推測の材料として区別しましょう。</span></div>
 <p class="model-note" style="margin-top:14px">正解を暗記するためのテストではなく、判断の根拠を比較するための教材です。</p>
 </div><div class="paper-card">${isComp?compareModelHtml(c):modelHtml(c.machine,point)}</div></div>
 <div class="feedback-next"><span class="feedback-next-note">${state.mode==='progress'&&state.choice==='no'?'撤退したので、このシナリオはここで終了。':'今後の展開を見て、いまの判断の正しさを後付けで決めないことが大切。'}</span><button type="button" class="button button-primary" data-action="next">${state.mode==='progress'&&state.choice!=='no'&&state.stage<c.stages.length-1?'次の状況を見る':'次の問題へ進む'} <span class="arrow" aria-hidden="true">→</span></button></div>
 </div></div>`;
}
function renderFinish(){const m=CASE_MODES[state.mode],d=countDone(state.mode);return `<div class="shell page"><section class="finish-wrap"><div class="finish-symbol" aria-hidden="true">✓</div><span class="interior-eyebrow">SESSION COMPLETE</span><h1>${m.label}をひと通り学習！</h1><p>${d} / ${m.count} ケースを完了しました。判断の結果だけでなく、使った根拠を振り返ってみよう。<br>別のモードへ進むか、最初から復習できます。</p><div class="finish-actions"><button class="button button-dark" type="button" data-action="results">学習記録を見る</button><button class="button button-outline" type="button" data-action="restart-mode" data-mode="${state.mode}">このモードを復習する</button><button class="button button-primary" type="button" data-action="home">ホームへ戻る <span class="arrow">→</span></button></div></section></div>`;}
function renderLearn(){return `<div class="shell page"><div class="interior-head"><span class="interior-eyebrow">HOW TO LEARN / はじめに</span><h1>「当てる」よりも、<br>「根拠を説明できる」を目指す。</h1><p>高設定確定を目指すクイズではありません。設定推測・期待値・時間効率を区別して、自分の判断を説明するための練習です。</p></div>
 <div class="info-grid"><section class="info-card"><span class="index">01 / DATA</span><h2>設定推測は、履歴から始まる。</h2><p>REGは設定差が大きい機種が多い一方、BIGの設定差も機種によって異なります。両方の当選回数と総ゲーム数を、セットで見ましょう。</p><p>少ないGでREGが突出していても、低設定の上振れは残ります。試行回数を増やせば情報量は増えますが、設定が確定するわけではありません。</p></section>
 <section class="info-card"><span class="index">02 / DECISION</span><h2>「推測」と「座る価値」を分ける。</h2><p>高設定の可能性があっても、その機種の出玉率・残り時間・移動コスト・許容できる損失によっては見送る判断もあります。</p><p>すでに打った枚数や勝った枚数で、次のゲームの抽選確率が変わるわけではありません。</p></section>
 <section class="info-card"><span class="index">03 / UPDATE</span><h2>経過で、判断を更新する。</h2><p>途中経過を見たら、現在の累計BB・REG・総Gで再評価します。直近のハマりだけを過大評価しないことが大切です。</p><p>未来の結果を知ってから過去の判断を採点しません。撤退後に出たとしても、当時の判断が間違いとは限りません。</p></section>
 <section class="info-card"><span class="index">04 / MODEL</span><h2>表示される確率は、仮定付き。</h2><p>各設定のBB・RB公表確率を使って、当選／非当選の履歴の説明しやすさ（尤度）を比較しています。設定投入割合は不明なので、学習用の事前分布を選んで計算します。</p><span class="formula">L(s) ∝ pBB(s)^BB × pRB(s)^RB × (1 − pBB(s) − pRB(s))^(G − BB − RB)</span><p>「均等」では各設定1/6。「低設定多め」は1〜6を45 / 25 / 15 / 9 / 5 / 1%と置く<strong>説明用の仮定</strong>です。いずれもホールの実際の設定配分とは限りません。</p></section>
 <section class="info-card full"><span class="index">SOURCE / DATA</span><h2>機種スペックの出典</h2><p>BB・RB・出玉率は、北電子の公式製品ページを参照しています。メーカー発表の出玉率は工場データに基づく予測値です。独立した非公式教材で、メーカー・ホールとは無関係です。</p><div class="source-links">${Object.values(SPECS).map(s=>`<a class="source-link" href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name} <span>メーカー公式 ↗</span></a>`).join('')}</div></section>
 </div><div class="note-banner">このサイトは判断練習用の教材です。架空のボーナス履歴を使用しており、実際の高設定・収益・勝率を保証しません。実戦では自分で決めた予算と時間の範囲で判断してください。</div>
 </div>`;}
function renderResults(){const s=summaryStats();return `<div class="shell page"><div class="interior-head"><span class="interior-eyebrow">YOUR TRAINING LOG</span><h1>学習記録</h1><p>この端末で解いた問題を集計しています。「一致率」は教材の参考スタンスとの一致であり、実際の勝率や設定判別的中率ではありません。</p></div>
 <section class="stats-grid" aria-label="学習のサマリー"><div class="stat-tile"><small>完了ケース</small><strong>${s.done} <span style="font-size:13px;color:var(--muted)">/ ${totalCases()}</span></strong></div><div class="stat-tile"><small>判断した回数</small><strong>${s.decisions}</strong></div><div class="stat-tile"><small>参考スタンス一致</small><strong>${s.matchRate===null?'—':s.matchRate+'%'}</strong></div><div class="stat-tile"><small>理由の着眼点</small><strong>${s.reasonRate===null?'—':s.reasonRate+'%'}</strong></div></section>
 <div class="stats-details"><div class="paper-card"><div class="card-kicker">BY MODE</div><h3>モード別の進捗</h3>${Object.keys(CASES).map(id=>`<div class="stats-row"><strong>${CASE_MODES[id].label}</strong><span>${countDone(id)} / ${CASES[id].length}</span></div>`).join('')}<div class="results-actions"><button class="button button-dark" data-action="home">練習を続ける <span class="arrow">→</span></button><button type="button" class="button button-outline" data-action="share-progress">回答結果をLINEで送る <span class="arrow">↗</span></button></div></div>
 <div class="paper-card"><div class="card-kicker">WHAT IT MEANS</div><h3>成績の読み方</h3><p>参考判断と違ったケースほど、なぜ違うのかを考えてみましょう。特に△は正解／不正解よりも、判断の条件を説明できるかが重要です。</p><p>復習すると、そのモードの回答・記録は上書きされます。他のモードの履歴は残ります。</p><button class="button button-outline" type="button" data-action="reset">すべての学習記録を消去</button></div></div>
 <div class="note-banner">保存先はこの端末のブラウザ（localStorage）です。別のスマホとの自動同期や、講師側からの成績確認はVer.1ではできません。プライベートブラウズや端末のデータ削除で記録が失われる場合があります。</div></div>`;}
function render(){document.title='AFTER 9 — ジャグラー実戦判断トレーナー';let html;
 switch(state.route){case'home':html=renderHome();break;case'learn':html=renderLearn();break;case'results':html=renderResults();break;case'quiz':html=state.submitted?renderFeedback():renderQuiz();break;case'finish':html=renderFinish();break;default:html=renderHome();}
 app.innerHTML=html;renderNav();}

function resetAll(){if(!confirm('この端末の学習記録をすべて削除します。よろしいですか？'))return;store.answers={};store.done=[];persist();go('results');showToast('学習記録を消去しました');}
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-action]');if(!button)return;
 if(button.tagName==='A')e.preventDefault();
 const act=button.dataset.action;
 if(act==='home'||act==='learn'||act==='results')return go(act);
 if(act==='start')return startMode(button.dataset.mode);
 if(act==='restart-mode')return startMode(button.dataset.mode,true);
 if(act==='choose'&&state.route==='quiz'&&!state.submitted){state.choice=button.dataset.choice;render();app.querySelector(`[data-action="choose"][data-choice="${state.choice}"]`)?.focus({preventScroll:true});return;}
 if(act==='reason'&&state.route==='quiz'&&!state.submitted){state.reason=button.dataset.reason;render();app.querySelector(`[data-action="reason"][data-reason="${state.reason}"]`)?.focus({preventScroll:true});return;}
 if(act==='submit')return submit();
 if(act==='next'&&state.submitted)return next();
 if(act==='prior'&&state.submitted){state.prior=button.dataset.prior==='low'?'low':'equal';render();app.querySelector(`[data-action="prior"][data-prior="${state.prior}"]`)?.focus({preventScroll:true});return;}
 if(act==='share')return shareLink();
 if(act==='share-progress')return shareProgress();
 if(act==='reset')return resetAll();
});

// Exposed only for offline verification; ordinary use does not need a backend.
window.__AFTER9_TEST__={bestPriorResult,stats:summaryStats,store,go,startMode,state,submit,next,render};
render();
})();

</script>
</body>
</html>
